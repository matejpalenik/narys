packages:
  - apps/*

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

overrides:
  # Keep Drizzle Kit's legacy loader on the patched esbuild line used by the kit.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # The TSDoc linter pulls in an older TypeScript ESLint parser.
  '@typescript-eslint/typescript-estree@8.56.1>minimatch': 11.0.9
